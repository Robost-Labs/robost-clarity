# Robost Clarity - Cloud Build Configuration
# Builds and deploys to Cloud Run

steps:
  # Build API service
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/robost-api:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/robost-api:latest'
      - '-f'
      - 'services/api/Dockerfile'
      - 'services/api'
    id: 'build-api'

  # Build Web service
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/robost-web:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/robost-web:latest'
      - '-f'
      - 'services/web/Dockerfile'
      - 'services/web'
      - '--build-arg'
      - 'REACT_APP_API_URL=${_API_URL}'
    id: 'build-web'

  # Build Consumer service
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/robost-consumer:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/robost-consumer:latest'
      - '-f'
      - 'services/consumer/Dockerfile'
      - 'services/consumer'
    id: 'build-consumer'

  # Push API image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/robost-api:$SHORT_SHA']
    id: 'push-api'
    waitFor: ['build-api']

  # Push Web image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/robost-web:$SHORT_SHA']
    id: 'push-web'
    waitFor: ['build-web']

  # Push Consumer image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/robost-consumer:$SHORT_SHA']
    id: 'push-consumer'
    waitFor: ['build-consumer']

  # Deploy API to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'robost-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/robost-api:$SHORT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'POSTGRES_HOST=/cloudsql/${_CLOUD_SQL_CONNECTION}'
      - '--add-cloudsql-instances'
      - '${_CLOUD_SQL_CONNECTION}'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
    id: 'deploy-api'
    waitFor: ['push-api']

  # Deploy Web to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'robost-web'
      - '--image'
      - 'gcr.io/$PROJECT_ID/robost-web:$SHORT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '5'
    id: 'deploy-web'
    waitFor: ['push-web']

# Images to store in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/robost-api:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/robost-api:latest'
  - 'gcr.io/$PROJECT_ID/robost-web:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/robost-web:latest'
  - 'gcr.io/$PROJECT_ID/robost-consumer:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/robost-consumer:latest'

# Substitution variables (set these in Cloud Build trigger)
substitutions:
  _REGION: 'us-central1'
  _CLOUD_SQL_CONNECTION: 'project:region:instance'
  _API_URL: 'https://robost-api-xxxxx.run.app'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1200s'
